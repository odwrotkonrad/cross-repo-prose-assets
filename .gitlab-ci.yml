workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - release
  - trigger

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. gke-linux-amd64 resolves to the medium
#   size, matching the SaaS runner it replaces
default:
  tags:
    - gke-linux-amd64

variables:
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest

validate-pre-commit-all:
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

tag-mint:
  stage: release
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
  script:
    - make tag-mint

tag-delta:
  stage: release
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    GIT_DEPTH: "0"
  script:
    - PROSE_PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$CI_COMMIT_TAG^" 2>/dev/null || true)
    - echo "PROSE_TAG=$CI_COMMIT_TAG" > delta.env
    - echo "PROSE_PREV_TAG=$PROSE_PREV_TAG" >> delta.env
    - cat delta.env
  artifacts:
    reports:
      dotenv: delta.env

trigger-control:
  stage: trigger
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs: [tag-delta]
  inherit:
    variables: false
  trigger:
    project: konradodwrot/control
    branch: main
    forward:
      yaml_variables: true
      pipeline_variables: false
