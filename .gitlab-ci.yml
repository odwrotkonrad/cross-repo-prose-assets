workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - release
  - trigger

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. gke-linux-amd64 resolves to the medium
#   size, matching the SaaS runner it replaces
default:
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64

variables:
  CI_IMAGE: $GRP_VAR_ARTIFACT_REGISTRY/ci-linux:$GRP_VAR_CI_IMAGES_REF

validate-pre-commit-all:
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

tag-mint:
  stage: release
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
  script:
    - make tag-mint

trigger-control:
  stage: trigger
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  #[why] PROSE_TAG must be a yaml variable: forward:yaml_variables carries those, dotenv from needs is
  #   job-scoped and never reaches the downstream. CI_COMMIT_TAG is predefined on tag pipelines, so no
  #   upstream job is needed to produce it
  variables:
    PROSE_TAG: $CI_COMMIT_TAG
  trigger:
    project: konradodwrot/control
    branch: main
    forward:
      yaml_variables: true
      pipeline_variables: false
