# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
ontoRepo:
  options:
    autoDiscover: true
  include:
    renderTemplates:
      - source: templates/2-data
        dest: assets/data
        <<<:
          - source: /makefile-agents.md.ontoRepo.tpl
            dest: makefile.agents.md
          - source: /repo-structure.md.ontoRepo.tpl
            dest: repo-structure.md
      - source: shared/license/LICENSE
        options:
          skipAutoGeneratedHeader: true
        dest: LICENSE
      #[why] the tagging flow is authored once in shared/ci and rendered into every consumer, prose included: one copy of the logic, no tracked duplicate per repo
      - source: shared/ci
        chmod: "0755"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: /semver-bump.zsh
            dest: ci/semver-bump.zsh
          - source: /tag-mint.zsh
            dest: ci/tag-mint.zsh
      - source: templates/3-audience/AGENTS.md.ontoRepo.tpl
        dest:
          - CLAUDE.md
          - path: AGENTS.md
            options:
              renderReferencedFiles: true

claude-agents:
  options:
    autoDiscover: true
    runIf:
      - builtin:isVirt
  include:
    profiles:
      - source: "@https://gitlab.com/konradodwrot/configs//profiles/llm/claude/che.yml::llm/claude/virt"
        ctx:
          repo: Prose
##[<] 🤖🤖
