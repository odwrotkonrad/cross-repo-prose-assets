# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
ontoRepo:
  options:
    autoDiscover: true
  include:
    renderTemplates:
      - source: repos/cross-repo/prose/assets/purpose.md
        options:
          skipAutoGeneratedHeader: true
        dest: assets/docs-agents/purpose.md
      - source: templates/2-data
        dest: assets/data
        <<<:
          - source: /makefile-agents.md.ontoRepo.tpl
            dest: makefile.agents.md
          - source: /repo-structure.md.ontoRepo.tpl
            dest: repo-structure.md
      - source: shared/license/LICENSE
        options:
          skipAutoGeneratedHeader: true
        dest: LICENSE
      - source: "@gitlab.com/konradodwrot/cross-repo/prose/spec?ref=${{ env.PROSE_SPEC_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //conventions/conventions.md
            dest: assets/data/conventions.md
      - source: "@gitlab.com/konradodwrot/cross-repo/misc?ref=${{ env.MISC_REF }}"
        chmod: "0755"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //ci/semver-bump.zsh
            dest: ci/semver-bump.zsh
          - source: //ci/tag-mint.zsh
            dest: ci/tag-mint.zsh
      - source: repos/cross-repo/prose/assets/templates/3-audience
        <<<:
          - source: /README.md.ontoRepo.tpl
            dest: README.md
          - source: /AGENTS.md.ontoRepo.tpl
            dest:
              - CLAUDE.md
              - path: AGENTS.md
                options:
                  renderReferencedFiles: true

claude-agents:
  options:
    autoDiscover: true
    runIf:
      - builtin:isVirt
  include:
    profiles:
      - source: "@https://gitlab.com/konradodwrot/configs//profiles/llm/claude/che.yml::llm/claude/virt"
        ctx:
          repo: ProseAssets

envSeed:
  include:
    renderTemplates:
      - source: .env.tpl
        dest:
          - path: .env
            options:
              writeType: mergeUpsert
##[<] 🤖🤖
